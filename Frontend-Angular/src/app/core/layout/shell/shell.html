<a href="#main-content" class="sh-skip-link">{{ 'a11y.skipToContent' | translate }}</a>

<div class="flex min-h-dvh">
  <aside
    class="hidden w-64 shrink-0 flex-col border-r border-border bg-surface lg:flex"
    [attr.aria-label]="'nav.sidebar' | translate"
  >
    <div class="flex h-16 items-center gap-2 border-b border-border px-5">
      <span class="flex size-8 items-center justify-center rounded-lg bg-primary text-primary-fg">
        <i class="pi pi-box" aria-hidden="true"></i>
      </span>
      <span class="text-lg font-semibold tracking-tight">StockHub</span>
    </div>
    <div class="flex-1 overflow-y-auto p-3">
      <app-sidebar-nav />
    </div>
  </aside>

  <p-drawer [(visible)]="mobileNavOpen" [modal]="true" styleClass="!w-72" [header]="'StockHub'">
    <app-sidebar-nav (navigate)="mobileNavOpen.set(false)" />
  </p-drawer>

  <div class="flex min-w-0 flex-1 flex-col">
    <header
      class="sticky top-0 z-30 flex h-16 items-center gap-3 border-b border-border bg-surface/90 px-4 backdrop-blur sm:px-6"
    >
      <button
        type="button"
        class="flex size-10 items-center justify-center rounded-lg text-fg-muted hover:bg-surface-muted hover:text-fg lg:hidden"
        [attr.aria-label]="'nav.openMenu' | translate"
        [attr.aria-expanded]="mobileNavOpen()"
        (click)="mobileNavOpen.set(true)"
      >
        <i class="pi pi-bars text-lg" aria-hidden="true"></i>
      </button>
      <span class="text-base font-semibold lg:hidden">StockHub</span>
      <div class="ml-auto flex items-center gap-2">
        <app-language-switcher />
        <app-theme-switcher />
      </div>
    </header>

    <main
      id="main-content"
      tabindex="-1"
      class="mx-auto w-full max-w-screen-2xl flex-1 px-4 py-6 focus:outline-none sm:px-6 lg:px-8"
    >
      <router-outlet />
    </main>
  </div>
</div>
