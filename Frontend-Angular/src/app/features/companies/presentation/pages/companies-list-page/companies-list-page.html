<app-page-header
  [title]="'companies.list.title' | translate"
  [subtitle]="'companies.list.subtitle' | translate"
>
  <a actions pButton [routerLink]="routes.PLATFORM.COMPANY_CREATE" class="no-underline">
    <i pButtonIcon class="pi pi-plus" aria-hidden="true"></i>
    <span pButtonLabel>{{ 'companies.actions.new' | translate }}</span>
  </a>
</app-page-header>

<div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center">
  <app-search-field
    class="sm:max-w-sm sm:flex-1"
    [label]="'companies.list.search' | translate"
    [value]="list.filters().text"
    (searchChange)="onSearch($event)"
  />
  <p-select
    [options]="statusOptions()"
    optionLabel="label"
    optionValue="value"
    [showClear]="true"
    [placeholder]="'companies.list.allStatuses' | translate"
    [ariaLabel]="'companies.fields.status' | translate"
    [ngModel]="list.filters().status"
    (ngModelChange)="onStatus($event)"
    styleClass="w-full sm:w-52"
  />
</div>

<app-data-table
  [caption]="'companies.list.title' | translate"
  [columns]="columns()"
  [rows]="list.rows()"
  [rowKey]="rowKey"
  [loading]="list.loading()"
  [error]="list.error()"
  [total]="list.total()"
  [page]="list.page()"
  [size]="list.size()"
  [sort]="list.sort()"
  [clickable]="true"
  [emptyTitle]="'companies.list.empty' | translate"
  [emptyDescription]="'companies.list.emptyHint' | translate"
  [filtered]="list.filtered()"
  (clearFilters)="list.clearFilters()"
  (sortChange)="list.changeSort($event)"
  (pageChange)="list.changePage($event)"
  (rowSelect)="open($event)"
  (retry)="list.load()"
>
  <ng-template appCell="name" let-row>
    <a
      [routerLink]="routes.PLATFORM.COMPANY_DETAIL(row.id)"
      class="inline-flex min-h-11 items-center font-medium text-fg hover:text-primary md:min-h-6"
      (click)="$event.stopPropagation()"
    >
      {{ row.name }}
    </a>
  </ng-template>
  <ng-template appCell="status" let-row
    ><app-company-status-badge [status]="row.status"
  /></ng-template>
</app-data-table>
