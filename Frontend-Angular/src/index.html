<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>StockHub</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="StockHub — gestion de stock multi-entreprises et multi-emplacements"
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Applies the persisted theme before Angular boots to avoid a light flash.
      (function () {
        try {
          var p = localStorage.getItem('stockhub.theme');
          var dark =
            p === 'dark' ||
            ((p === null || p === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
