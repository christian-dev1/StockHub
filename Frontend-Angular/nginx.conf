server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # Same-origin API: the refresh cookie (SameSite=Strict) and no CORS in production.
    # "^~" wins over the static-file regex below, which would otherwise answer
    # API files such as /api/v1/products/{id}/barcode.svg from disk (404).
    location ^~ /api/ {
        proxy_pass ${BACKEND_URL};
        # Spring rebuilds the public origin from X-Forwarded-* and compares it with the
        # browser's Origin header: the host must keep its port (e.g. localhost:4300).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        client_max_body_size 12m;
    }

    location = /actuator/health {
        proxy_pass ${BACKEND_URL};
    }

    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location /i18n/ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
