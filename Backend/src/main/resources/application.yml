spring:
  application:
    name: stockhub
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  modulith:
    events:
      republish-outstanding-events-on-restart: true
      jdbc:
        schema-initialization:
          enabled: false
  messages:
    basename: i18n/messages
    fallback-to-system-locale: false
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: StockHub
    version: '@project.version@'

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: true

stockhub:
  cors:
    allowed-origins: ${STOCKHUB_CORS_ALLOWED_ORIGINS:}
  auth:
    jwt-secret: ${JWT_SECRET:}
    issuer: stockhub
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    max-failed-logins: 5
    login-lock-duration: 15m
  bootstrap:
    super-admin:
      email: ${STOCKHUB_SUPERADMIN_EMAIL:}
      password: ${STOCKHUB_SUPERADMIN_PASSWORD:}
