spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/stockhub}
    username: ${DB_USERNAME:stockhub}
    password: ${DB_PASSWORD:stockhub}

logging:
  level:
    com.stockhub: DEBUG
    org.hibernate.SQL: INFO

stockhub:
  cors:
    allowed-origins: ${STOCKHUB_CORS_ALLOWED_ORIGINS:http://localhost:4300,http://localhost:3100}
